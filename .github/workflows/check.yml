name: checks

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --all-groups
      - run: uv run ruff check comfyui_restoration scripts tests
      - run: uv run pytest -q
      - run: uv run python scripts/validate_workflows.py
      - run: uv run python -c "import json; from pathlib import Path; [json.loads(p.read_text()) for p in Path('comfyui_restoration/schemas').glob('*.json')]"
