[tools]
python = "3.12"
uv = "latest"
rust = "stable"

[env]
UV_PROJECT_ENVIRONMENT = ".venv"
UV_CACHE_DIR = ".uv-cache"

[tasks.sync]
description = "Create or update the uv virtual environment"
run = "uv sync"

[tasks.doctor]
description = "Check the media and language toolchain"
run = [
  "python --version",
  "uv --version",
  "rustup show active-toolchain",
  "cargo --version",
  "ffmpeg -hide_banner -version | head -n 1",
  "ffmpeg -hide_banner -filters 2>/dev/null | grep -E 'adeclick|adeclip' || true",
  "deep-filter --version",
  "test -f \"$LADSPA_PATH/libdeep_filter_ladspa.dylib\"",
  "sox --version",
]

[tasks.check]
description = "Run the available Python and Rust checks"
run = [
  "uv run ruff check .",
  "uv run pytest -q",
  "if test -f Cargo.toml; then cargo fmt --all -- --check && cargo check --all-targets; else echo 'No Cargo.toml yet; Rust toolchain verified by doctor.'; fi",
]

[tasks.test-workflows]
description = "Validate checked-in UI/API workflow JSON"
run = "python -c \"import json; from pathlib import Path; [json.loads(p.read_text()) for p in Path('examples/workflows').glob('*.json')]\""

[tasks.test-e2e-small]
description = "Run the tiny generated FFmpeg fixture through faithful branches"
run = "python scripts/test_e2e_small.py"

[tasks.audit-public]
description = "Reject personal paths and checked-in source media references"
run = "! rg -n '/Users/|/private/|/Applications/' --glob '!docs/prompts/**' --glob '!AGENTS.md' ."
