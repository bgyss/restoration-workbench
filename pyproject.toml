[project]
name = "restoration-workbench"
version = "0.1.0"
description = "Local-first ComfyUI workbench for evidence-driven audio/video restoration."
license = { file = "LICENSE" }
requires-python = ">=3.12,<3.13"
dependencies = []

[project.urls]
Repository = "https://github.com/bgyss/restoration-workbench"
Documentation = "https://github.com/bgyss/restoration-workbench/tree/main/docs"

[tool.comfy]
PublisherId = "bgyss"
DisplayName = "Audio/Video Restoration Workbench"
requires-comfyui = ">=0.0.0"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["comfyui_restoration*"]

[tool.setuptools.package-data]
comfyui_restoration = ["schemas/*.json"]

[tool.uv]
default-groups = ["dev"]

[dependency-groups]
dev = [
  "pytest>=8",
  "ruff>=0.8",
]

[tool.ruff]
line-length = 100
